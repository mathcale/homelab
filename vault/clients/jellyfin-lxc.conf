# Relevant lines of /etc/pve/lxc/107.conf (jellyfin, unprivileged)
# uid/gid 1000 is mapped 1:1 so files keep the ubuntu:ubuntu (1000:1000) owner from vault
features: nesting=1,keyctl=1,mount=nfs
mp0: /mnt/nfs-vault/movies,mp=/mnt/media/movies
mp1: /mnt/nfs-vault/tvshows,mp=/mnt/media/tvshows
mp2: /mnt/nfs-vault/music,mp=/mnt/media/music
unprivileged: 1
lxc.idmap: u 0 100000 1000
lxc.idmap: u 1000 1000 1
lxc.idmap: u 1001 101001 64535
lxc.idmap: g 0 100000 1000
lxc.idmap: g 1000 1000 1
lxc.idmap: g 1001 101001 64535
