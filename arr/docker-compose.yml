services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8080:8080 # qbittorrent web interface
      - 6881:6881 # qbittorrent torrent port
      - 6881:6881/udp # qbittorrent torrent port
      - 6789:6789 # nzbget
      - 9696:9696 # prowlarr
    volumes:
      - /home/ubuntu/homelab/arr/config/gluetun:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - SERVER_COUNTRIES=Brazil
      - SERVER_CITIES="São Paulo"
      - SERVER_HOSTNAMES="node-br-04.protonvpn.net"
      - FIREWALL_OUTBOUND_SUBNETS=172.16.1.0/24
      - WIREGUARD_PRIVATE_KEY=
      - HEALTH_VPN_DURATION_INITIAL=120s
    healthcheck:
      test: ping -c 1 www.google.com || exit 1
      interval: 60s
      timeout: 20s
      retries: 5
    restart: unless-stopped

  deunhealth:
    image: qmcgaw/deunhealth
    container_name: deunhealth
    network_mode: "none"
    environment:
      - LOG_LEVEL=info
      - HEALTH_SERVER_ADDRESS=127.0.0.1:9999
      - TZ=America/Sao_Paulo
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    labels:
      - deunhealth.restart.on.unhealthy="true"
    # ports:
    #   - 8080:8080
    #   - 6881:6881
    #   - 6881:6881/udp
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - /home/ubuntu/homelab/arr/config/qbittorrent:/config
      - /mnt/nfs/downloads:/data
    network_mode: service:gluetun
    healthcheck:
        test: ping -c 1 www.google.com || exit 1
        interval: 60s
        retries: 3
        start_period: 20s
        timeout: 10s

  nzbget:
    image: lscr.io/linuxserver/nzbget:latest
    container_name: nzbget
    # ports:
    #   - 6789:6789
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - NZBGET_USER=admin
      - NZBGET_PASS=
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/ubuntu/homelab/arr/config/nzbget:/config
      - /mnt/nfs/nzbget:/data
    restart: unless-stopped
    network_mode: service:gluetun

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    # ports:
    #   - 9696:9696
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/ubuntu/homelab/arr/config/prowlarr:/config
    restart: unless-stopped
    network_mode: service:gluetun

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/ubuntu/homelab/arr/config/sonarr:/config
      - /mnt/nfs/tvshows:/data
    ports:
      - 8989:8989

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/Sao_Paulo
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/ubuntu/homelab/arr/config/radarr:/config
      - /mnt/nfs/movies:/data
    ports:
      - 7878:7878

  # lidarr:
  #   container_name: lidarr
  #   image: lscr.io/linuxserver/lidarr:latest
  #   restart: unless-stopped
  #   volumes:
  #     - /etc/localtime:/etc/localtime:ro
  #     - /home/ubuntu/homelab/arr/config/lidarr:/config
  #     - /mnt/nfs/music:/data
  #   environment:
  #    - PUID=1000
  #    - PGID=1000
  #    - TZ=America/Sao_Paulo
  #   ports:
  #     - 8686:8686
  
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/ubuntu/homelab/arr/config/bazarr:/config
      - /mnt/nfs:/data
    ports:
      - 6767:6767
