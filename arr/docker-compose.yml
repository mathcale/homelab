  #     timeout: 20s
  #     retries: 5
  #   restart: unless-stopped

  deunhealth:
    image: qmcgaw/deunhealth
    container_name: deunhealth
    network_mode: "none"
    env_file:
      - stack.env
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    labels:
      - deunhealth.restart.on.unhealthy="true"
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    # network_mode: service:gluetun
    env_file:
      - stack.env
    volumes:
      - /home/ubuntu/homelab/arr/config/qbittorrent:/config
      - /mnt/nfs/downloads:/data
    restart: unless-stopped
    healthcheck:
        test: ping -c 1 www.google.com || exit 1
        interval: 60s
        retries: 3
        start_period: 20s
        timeout: 10s

  nzbget:
    image: lscr.io/linuxserver/nzbget:latest
    container_name: nzbget
    ports:
      - 6789:6789
    # network_mode: service:gluetun
    env_file:
      - stack.env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/ubuntu/homelab/arr/config/nzbget:/config
      - /mnt/nfs/nzbget:/downloads
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    ports:
      - 9696:9696
    # network_mode: service:gluetun
    env_file:
      - stack.env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/ubuntu/homelab/arr/config/prowlarr:/config
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    env_file:
      - stack.env
    ports:
      - 8989:8989
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/ubuntu/homelab/arr/config/sonarr:/config
      - /mnt/nfs/tvshows:/data
      - /mnt/nfs/downloads:/downloads/qbittorrent
      - /mnt/nfs/nzbget:/downloads/nzbget
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    env_file:
      - stack.env
    ports:
      - 7878:7878
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/ubuntu/homelab/arr/config/radarr:/config
      - /mnt/nfs/movies:/data
    restart: unless-stopped

  # lidarr:
  #   container_name: lidarr
  #   image: lscr.io/linuxserver/lidarr:latest
  #   ports:
  #     - 8686:8686
  #   volumes:
  #     - /etc/localtime:/etc/localtime:ro
  #     - /home/ubuntu/homelab/arr/config/lidarr:/config
  #     - /mnt/nfs/music:/data
  #   environment:
  #    - PUID=1000
  #    - PGID=1000
  #    - TZ=America/Sao_Paulo
  #   restart: unless-stopped
  
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    env_file:
      - stack.env
    ports:
      - 6767:6767
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/ubuntu/homelab/arr/config/bazarr:/config
      - /mnt/nfs:/data
    restart: unless-stopped
