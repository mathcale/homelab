services:
  navidrome:
    image: deluan/navidrome
    container_name: navidrome
    hostname: navidrome
    user: 1000:1000
    ports:
      - "4533:4533"
    env_file:
      - stack.env
    volumes:
      - /home/ubuntu/homelab/navidrome/data:/data
      - /mnt/nfs/music:/music:ro
    restart: unless-stopped
