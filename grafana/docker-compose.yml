services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    ports:
      - 3030:3000
    user: "1000"
    volumes:
      - /home/ubuntu/homelab/grafana/data:/var/lib/grafana
      - /home/ubuntu/homelab/grafana/config/grafana.ini:/etc/grafana/grafana.ini
      - /home/ubuntu/homelab/grafana/provisioning:/etc/grafana/provisioning
    env_file:
      - stack.env
    restart: unless-stopped
    networks:
      - net

networks:
  net:
    external:
      name: proxynet
