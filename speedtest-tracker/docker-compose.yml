services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    ports:
      - 8080:80
      - 8443:443
    env_file:
      - stack.env
    volumes:
      - /home/ubuntu/homelab/speedtest-tracker/config:/config
    restart: unless-stopped
