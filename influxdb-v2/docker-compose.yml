services:
  influxdb2:
    image: influxdb:2-alpine
    container_name: influxdb2
    hostname: influxdb2
    user: "1000"
    ports:
      - 8086:8086
      - 8089:8089/udp
    volumes:
      - /home/ubuntu/homelab/influxdb-v2/data:/var/lib/influxdb2
      - /home/ubuntu/homelab/influxdb-v2/config:/etc/influxdb2
      - /home/ubuntu/homelab/influxdb-v2/scripts:/docker-entrypoint-initdb.d
    restart: always
    networks:
      - net

networks:
  net:
    external:
      name: proxynet
